name: Image Classification CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall .

      - name: Run Tests
        run: |
          pytest tests/

      - name: Create Application Package
        run: |
          mkdir build
          cp Main.py build/
          cp Model.py build/
          cp Predict.py build/
          cp classes.txt build/
          cp requirements.txt build/
          cp README.md build/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-classification-app
          path: build/